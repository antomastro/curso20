<!--SASS segunda clase-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>--Sass</title>

  <!--Enlazo el styles.css que se genera al compilar el sass-->
  <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

  <!--div con id inicial, que tiene una clase columna-centrada -->

  <div id="inicial" class="columna-centrada">
    <p>Hola Mundo</p>
  </div>

  <!--div con id inicial, que tiene una clase columna-top-->

  <div class="columna-top">
    <p>Hola Mundo</p>
  </div>

  <!--Ambas son columnas ,una centrada y otra arriba.  En css abria que seleccionar columna-central, display flex y flex direction column,alain items center y lo mismo para columna-top. En este modo se repite el codigo una y otra vez mientras que en SASS se puede hacer con un Mixings (que seria como una especie de variable y la podemos reutilizar en cualquier parte del codigo una y otra vez) -->

  <!-- Blog (*ver explicación de la creación de un bloque con mismo código en  la forma rápida, más abajo. En este caso es un blog. En el div central se agrega luego un botón <button> )-->

  <!-- div con la clase blogs --> 
  <div class="blogs">
    <div class="blog">
      <h3>Esto es un blog</h3>
      <p>Descripcion del blog</p>
    </div>
    <div class="blog">
      <h3>Esto es un blog</h3>
      <p>Descripcion del blog</p>
      <button>Leer màs</button>   <!-- Botón que se agrega al blog -->
    </div>
    <div class="blog">
      <h3>Esto es un blog</h3>
      <p>Descripcion del blog</p>
    </div>
  </div>
</body>
</html>


  <!--   * Explicación de la creación del  Blog en la forma rápida *  -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href=" ./registro.css">
  <title>Registro</title>
</head>
<body>
<!--formulario de registro-->
  <main class="contenedor" >
    <header>
      <h3 style="text-decoration: underline;">Sistema de Login y Registro</h3>
    </header>
  <div id="registro">
    <form id="registro" action=" ">  
    <h3 style="text-align: center;">Registro</h3>
  
    <label for="nombre">Nombre:</label>
    <input type="nombre" id="nombre"placeholder="Escribe tu nombre" style="border: none;border-radius: 4px; ">
    
    <label for="apellido">Apellido:</label>
    <input type="apellido" id="apellido"placeholder="Escribe tu apellido" style="border: none;border-radius: 4px;">
    
    <label for="nombreUsuario">Nombre de Usuario*:</label>
    <input type="nombreUsuario" id="nombreUsuario"placeholder="Escribe tu nombre de usuario " required style="border: none;border-radius: 4px;">
      
    <label for="email">Email*:</label>
    <input type="email" id="email"placeholder="Escribe tu correo" required style="border: none;border-radius: 4px;">
      
    <label for="password">Contraseña*:</label>
    <input type="password" id="password"placeholder="Escribe tu contraseña" required style="border: none;border-radius: 4px;">
    
    <label for="confirmPassword">Confirmar Contraseña*:</label>
    <input type="password" id="confirmPassword"placeholder="Repite tu contraseña" required style="border: none;border-radius: 4px;">

    <label for="role">Tipo de usuario:</label>
    <select name="role" id="role">
      <option value="admin">Administrador</option>
      <option value="user">Usuario</option>
    </select>
  
    <button type="submit" id="registrar">Registrarse</button>

    <p><small>Ya tienes una cuenta? <a href="login.html" id="login">Logìn</a></small></p>
  </form>
  </div>
  <!--boton para el modo oscuro. "Toggle" para cambiar el modo-->
  <button id= "toggleModoOscuro">Modo Oscuro</button>
</main>  
</body>
<script src="./registro.js"></script>
</html>

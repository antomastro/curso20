<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./administrarUsuarios.css">
  <title>Administrar Usuarios</title>
</head>
<body>
<!--administrar usuarios-->
<main class="contenedor">
  <header>
    <h3>Administrar Usuarios</h3>
  </header>

  <div id = usuario class="ocultar">
    <p>Nombre: <span id="nombreUsuario"></span></p>
    <p>Apellido: <span id="apellidoUsuario"></span></p>
    <p>Correo: <span id="correoUsuario"></span></p>
    <p>Role: <span id="roleUsuario"></span></p>
    <p>Id: <span id="idUsuario"></span></p>
    <p>Fecha de creacion: <span id="fechaCreacionUsuario"></span></p>
    <p>Fecha de actualizacion: <span id="fechaActualizacionUsuario"></span></p>
    <p>Ultimo acceso: <span id="ultimoAcceso"></span></p>
  </div>
  
  <!--boton para el modo oscuro. "Toggle" para cambiar el modo-->
  <button id= "toggleModoOscuro">Modo Oscuro</button>
</main>
</body>
<script src="./administrarUsuarios.js"></script>
</html>
